<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{--red:#8b1a1a;--white:#ffffff;--off-white:#f9f6f1;--ink:#1a1a1a;--muted:#6b6b6b;--border:#e5e0d8;}
    body{font-family:'Inter',sans-serif;background:var(--white);color:var(--ink);}
    nav{background:white;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--red);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
    .nav-logo{display:flex;align-items:center;gap:0.7rem;text-decoration:none;}
    .nav-logo-icon{background:var(--red);color:white;width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
    .nav-logo-text{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--ink);font-weight:700;}
    .nav-logo-text span{color:var(--red);}
    nav a.back{color:var(--muted);text-decoration:none;font-size:0.85rem;}
    nav a.back:hover{color:var(--red);}
    .hero{background:var(--off-white);padding:80px 2rem 4rem;text-align:center;border-bottom:2px solid var(--border);}
    .hero-badge{display:inline-block;background:var(--red);color:white;font-size:0.75rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:0.3rem 1rem;border-radius:4px;margin-bottom:1.5rem;}
    .hero-icon{font-size:4rem;margin-bottom:1rem;}
    .hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,3rem);color:var(--ink);margin-bottom:1rem;}
    .hero p{color:var(--muted);max-width:600px;margin:0 auto 1.5rem;line-height:1.8;}
    .hero-tags{display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;}
    .tag{background:white;border:1px solid var(--border);color:var(--red);font-size:0.78rem;font-weight:600;padding:0.3rem 0.8rem;border-radius:4px;}
    .content{max-width:900px;margin:0 auto;padding:3rem 2rem 5rem;}
    .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem;margin-bottom:2rem;}
    .info-card{background:white;border:1px solid var(--border);border-radius:8px;padding:1.5rem;border-top:3px solid var(--red);}
    .info-card h2{color:var(--red);font-size:1rem;margin-bottom:1rem;}
    .info-card ul{list-style:none;display:flex;flex-direction:column;gap:0.6rem;}
    .info-card ul li{color:var(--muted);font-size:0.85rem;display:flex;align-items:flex-start;gap:0.5rem;line-height:1.5;}
    .info-card ul li::before{content:'→';color:var(--red);flex-shrink:0;}
    .salary-box{background:var(--red);color:white;border-radius:8px;padding:2rem;text-align:center;margin-bottom:2rem;}
    .salary-box h2{font-family:'Playfair Display',serif;margin-bottom:1rem;}
    .salary-num{font-size:2.5rem;font-weight:700;}
    .salary-label{font-size:0.85rem;opacity:0.8;margin-top:0.3rem;}
    .right-for-you{background:var(--off-white);border:1px solid var(--border);border-radius:8px;padding:1.5rem;margin-bottom:2rem;}
    .right-for-you h2{color:var(--red);margin-bottom:1rem;font-family:'Playfair Display',serif;}
    .check-list{list-style:none;display:flex;flex-direction:column;gap:0.7rem;}
    .check-list li{color:var(--muted);font-size:0.88rem;display:flex;align-items:flex-start;gap:0.7rem;line-height:1.5;}
    .check-list li::before{content:'✓';color:#16a34a;font-weight:700;flex-shrink:0;}
    .btn-back{display:inline-block;background:var(--red);color:white;padding:0.8rem 2rem;border-radius:4px;text-decoration:none;font-weight:600;margin-right:1rem;}
    .btn-quiz{display:inline-block;background:transparent;color:var(--red);padding:0.8rem 2rem;border-radius:4px;text-decoration:none;font-weight:600;border:2px solid var(--red);}
    footer{background:var(--ink);color:rgba(255,255,255,0.6);padding:2rem;text-align:center;font-size:0.82rem;}
    footer strong{color:white;}
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-icon">🎓</div>
      <div class="nav-logo-text">CSU <span>Course Guide</span></div>
    </a>
    <a href="index.html" class="back">← Back to Home</a>
  </nav>
  <div id="app"></div>
  <footer><p><strong>CSU Course Guide</strong> · Cagayan State University — Sanchez Mira Campus 🇵🇭</p></footer>
  <script>
    const courses = {
      bsed:{badge:"Education",icon:"📚",title:"Bachelor of Secondary Education",desc:"Become the teacher who changes lives. BSEd prepares you to educate high school students with passion, dedication, and expertise.",tags:["4 Years","Licensure Exam (LET)","Government Jobs","Stable Career"],learn:["Teaching methods and strategies","Educational psychology","Major subject specialization","Classroom management","Curriculum development","Assessment and evaluation"],careers:["High School Teacher","School Administrator","Education Supervisor","Curriculum Developer","Tutorial Center Instructor","DepEd Employee"],where:["Public and private high schools","DepEd regional offices","Tutorial and review centers","Alternative learning centers","Non-government organizations","Abroad as Filipino teachers"],subjects:["Principles of Teaching","Child and Adolescent Development","The Teacher and the School Curriculum","Assessment in Learning","Educational Technology","Practice Teaching"],salary:"₱22,000 – ₱30,000",salaryNote:"as a government teacher · Senior teachers and department heads earn more",checks:["You love teaching and sharing knowledge","You are patient and good at explaining","You want a stable government job","You care deeply about student growth","You enjoy working with teenagers","You want to make a difference in your community"]},
      beed:{badge:"Education",icon:"🎒",title:"Bachelor of Elementary Education",desc:"Shape young minds during their most important years. BEEd prepares you to be a compassionate elementary teacher who builds the foundation for lifelong learning.",tags:["4 Years","Licensure Exam (LET)","Government Jobs","High Demand"],learn:["Child psychology and development","Teaching methods for young learners","Reading and literacy instruction","Mathematics for elementary","Arts Music and PE teaching","Special needs education basics"],careers:["Elementary School Teacher","Grade School Teacher","DepEd Teacher","Day Care Teacher","Tutorial Teacher","School Coordinator"],where:["Public and private elementary schools","DepEd offices","Day care centers","NGOs and community programs","Tutorial centers","Abroad as Filipino teachers"],subjects:["Child and Adolescent Development","The Child and Nature of Learning","Teaching Literacy in the Early Grades","Assessment in Elementary Schools","Special Education basics","Practice Teaching"],salary:"₱22,000 – ₱28,000",salaryNote:"as a government teacher · Increases with years of service and promotions",checks:["You love children and enjoy working with them","You are patient kind and nurturing","You want a meaningful and stable career","You enjoy creative and fun teaching activities","You want to serve your community","You dream of being a role model for young kids"]},
      bsba:{badge:"Business",icon:"📊",title:"BS Business Administration",desc:"Learn to think like a leader and act like an entrepreneur. BSBA equips you with the skills to manage businesses, lead teams, and create opportunities.",tags:["4 Years","Board Exam Available","High Earning Potential","Versatile Career"],learn:["Business management and organization","Financial management and accounting","Marketing and sales strategies","Human resource management","Business law and ethics","Entrepreneurship and innovation"],careers:["Business Manager","Marketing Officer","Human Resources Staff","Entrepreneur","Bank Officer","Government Administrative Officer"],where:["Banks and financial institutions","Business process outsourcing (BPO)","Retail and commercial companies","Government agencies","Your own business","International companies"],subjects:["Principles of Management","Financial Accounting","Business Mathematics","Marketing Management","Human Resource Management","Entrepreneurship"],salary:"₱18,000 – ₱30,000",salaryNote:"starting salary · Business owners and executives can earn much more",checks:["You enjoy leadership and decision making","You are interested in how businesses work","You like working with people and teams","You want to start your own business someday","You are good at planning and organizing","You enjoy economics and financial topics"]}
    };
    const key = location.pathname.split('/').pop().replace('.html','');
    const d = courses[key];
    document.title = d.title + ' — CSU Sanchez Mira';
    document.getElementById('app').innerHTML = `
      <div class="hero">
        <div class="hero-badge">${d.badge}</div>
        <div class="hero-icon">${d.icon}</div>
        <h1>${d.title}</h1>
        <p>${d.desc}</p>
        <div class="hero-tags">${d.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="content">
        <div class="info-grid">
          <div class="info-card"><h2>📖 What You'll Learn</h2><ul>${d.learn.map(i=>`<li>${i}</li>`).join('')}</ul></div>
          <div class="info-card"><h2>💼 Career Paths</h2><ul>${d.careers.map(i=>`<li>${i}</li>`).join('')}</ul></div>
          <div class="info-card"><h2>🌏 Where You Can Work</h2><ul>${d.where.map(i=>`<li>${i}</li>`).join('')}</ul></div>
          <div class="info-card"><h2>📋 Subjects Overview</h2><ul>${d.subjects.map(i=>`<li>${i}</li>`).join('')}</ul></div>
        </div>
        <div class="salary-box">
          <h2>💰 Average Starting Salary in Philippines</h2>
          <div class="salary-num">${d.salary}</div>
          <div class="salary-label">per month ${d.salaryNote}</div>
        </div>
        <div class="right-for-you">
          <h2>✅ Is ${d.title} Right for You?</h2>
          <ul class="check-list">${d.checks.map(i=>`<li>${i}</li>`).join('')}</ul>
        </div>
        <a href="index.html" class="btn-back">← Back to Courses</a>
        <a href="quiz.html" class="btn-quiz">Take the Quiz →</a>
      </div>
    `;
  </script>
</body>
</html>
